<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADBUQ Billboards - Premium Listings</title>
    <!-- Modern font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1>ADBUQ Premium Billboards</h1>
    </header>

    <main class="container">
        <div id="loading" class="loading">
            Loading premium listings from Cloudflare D1...
        </div>
        <div id="error-msg"></div>
        <div id="billboards-grid"></div>
    </main>

    <!-- Vanilla JS Frontend Logic (Replaced PyScript to fix WebAssembly/CDN errors) -->
    <script>
        async function loadBillboards() {
            try {
                // Actual Worker URL
                const PRODUCTION_API_URL = "https://scraper-adspace.abdulahadbutt420.workers.dev/api/billboards";
                
                let data;
                try {
                    const response = await fetch(PRODUCTION_API_URL);
                    data = await response.json();
                } catch (err) {
                    // Fallback to relative fetching if hosted on the same domain
                    const response = await fetch("/api/billboards");
                    data = await response.json();
                }

                const grid = document.getElementById("billboards-grid");
                const loading = document.getElementById("loading");
                
                loading.style.display = "none";
                
                if (!data || data.length === 0) {
                    grid.innerHTML = "<p style='text-align:center;width:100%;'>No billboards found in the database.</p>";
                    return;
                }

                data.forEach(b => {
                    const card = document.createElement("div");
                    card.className = "card";
                    
                    let imgSrc = b.image_url || "https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=600&auto=format&fit=crop";
                    if (!imgSrc.startsWith("http")) {
                        imgSrc = "https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=600&auto=format&fit=crop";
                    } else if (imgSrc.includes("adbuq.com")) {
                        // Pass adbuq images through the Cloudflare worker proxy to bypass hotlinking protection
                        const PROXY_URL = PRODUCTION_API_URL.replace("/api/billboards", "/api/image");
                        imgSrc = `${PROXY_URL}?url=${encodeURIComponent(imgSrc)}`;
                    }
                        
                    const title = b.title || 'Unknown Title';
                    const city = b.city || 'Unknown City';
                    const media = b.media_type || 'Billboard';
                    const size = b.size || 'N/A';
                    const price = b.price || 'N/A';
                    
                    card.innerHTML = `
                        <img class="card-img" src="${imgSrc}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1542204165-65bf26472b9b?q=80&w=600&auto=format&fit=crop';" />
                        <div class="card-content">
                            <h2 class="card-title">${title}</h2>
                            <div class="card-meta">
                                <span class="badge">${city}</span>
                                <span class="badge">${media}</span>
                                <span class="badge">${size}</span>
                            </div>
                            <div class="card-price">${price}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (e) {
                const loading = document.getElementById("loading");
                loading.style.display = "none";
                const errorDiv = document.getElementById("error-msg");
                errorDiv.style.display = "block";
                errorDiv.innerText = `Error loading data: ${e.message}\n\nMake sure your Cloudflare Worker is deployed and the PRODUCTION_API_URL is correctly set in index.html!`;
                console.error("Error:", e);
            }
        }

        // Run the function when the page loads
        document.addEventListener("DOMContentLoaded", loadBillboards);
    </script>
</body>
</html>
